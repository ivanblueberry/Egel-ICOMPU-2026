name: Revisar enlaces externos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comprobar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path dist
            --accept 200,206,429
            README.md DISCLAIMER.md CONTRIBUTING.md SECURITY.md docs/**/*.md guia/**/*.tex guia/referencias.bib
