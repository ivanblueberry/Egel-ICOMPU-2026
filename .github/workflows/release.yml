name: Publicar versión

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1794441600"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.17.0

      - name: Regenerar y verificar contenido
        run: |
          python tools/generar.py
          python tools/verificar.py
          python -m unittest discover -s tests
          python tools/auditar_publicacion.py --all-files

      - name: Compilar y verificar PDF
        run: |
          tectonic -X compile guia/main.tex --reruns 1 --keep-intermediates --keep-logs
          tectonic -X compile guia/main.tex --reruns 1 --keep-intermediates --keep-logs
          cp guia/main.pdf dist/Guia-EGEL-Plus-ICOMPU.pdf
          python tools/verificar_pdf.py
          git diff --exit-code

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/Guia-EGEL-Plus-ICOMPU.pdf
